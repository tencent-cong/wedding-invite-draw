<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>抽签后台 · 婚礼森友会</title>
<style>
  body { font-family: "PingFang SC", "Hiragino Sans GB", sans-serif; background: #f6f7f2; color: #4d4436; margin: 0; padding: 24px 16px 60px; }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .hint { font-size: 12.5px; color: #8d8471; margin-bottom: 18px; }
  .stats { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
  .box { background: #fff; border-radius: 14px; padding: 12px 16px; box-shadow: 0 2px 8px rgba(0,0,0,.06); font-size: 13px; }
  .box b { display: block; font-size: 22px; color: #f2736b; }
  table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 14px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,.06); font-size: 13.5px; }
  th, td { padding: 11px 12px; text-align: left; border-bottom: 1px solid #f0eee6; }
  th { background: #fbf9f2; font-size: 12.5px; color: #8d8471; font-weight: 600; }
  td.code { font-weight: 800; color: #f2736b; }
  .pool { margin-top: 18px; background: #fff; border-radius: 14px; padding: 14px 16px; box-shadow: 0 2px 8px rgba(0,0,0,.06); }
  .pool span { display: inline-block; background: #eef7e6; color: #6e8a52; border-radius: 8px; padding: 4px 9px; margin: 3px 4px 3px 0; font-size: 12.5px; font-weight: 700; }
  input { border: 2px solid #e6e0d0; border-radius: 10px; padding: 9px 12px; font-size: 14px; outline: none; }
  button { border: 0; background: #f7a93c; color: #fff; font-weight: 700; border-radius: 10px; padding: 10px 18px; margin-left: 8px; cursor: pointer; font-size: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🎟️ 抽签记录后台</h1>
  <p class="hint">输入管理密钥查看谁抽了哪张（默认 congjiang，可用环境变量 ADMIN_KEY 修改）</p>
  <div style="margin-bottom:18px">
    <input id="key" placeholder="管理密钥" /><button id="go">查看</button>
  </div>
  <div class="stats" id="stats"></div>
  <table><thead><tr><th>时间</th><th>名字</th><th>抽中编号</th><th>访客标识</th></tr></thead><tbody id="rows"></tbody></table>
  <div class="pool"><b style="font-size:13px;color:#8d8471">尚未抽走的编号</b><div id="pool" style="margin-top:8px"></div></div>
</div>
<script>
  const $ = (i) => document.getElementById(i);
  async function load() {
    const key = $('key').value.trim();
    const r = await fetch('/api/admin/list?key=' + encodeURIComponent(key));
    if (r.status === 403) { alert('密钥不正确'); return; }
    const d = await r.json();
    $('stats').innerHTML =
      '<div class="box">总数<b>' + d.total + '</b></div>' +
      '<div class="box">已抽走<b>' + (d.total - d.remaining) + '</b></div>' +
      '<div class="box">剩余<b>' + d.remaining + '</b></div>';
    $('rows').innerHTML = d.rows.length
      ? d.rows.map((x) => '<tr><td>' + x.at + '</td><td>' + (x.name || '-') + '</td><td class="code">NO.' + x.code + '</td><td style="color:#a9a193">' + x.token + '</td></tr>').join('')
      : '<tr><td colspan="4" style="color:#a9a193">还没有人抽签</td></tr>';
    $('pool').innerHTML = d.unclaimed.map((c) => '<span>' + c + '</span>').join('') || '<span>已全部抽完</span>';
    localStorage.setItem('admin-key', key);
  }
  $('go').addEventListener('click', load);
  $('key').addEventListener('keydown', (e) => { if (e.key === 'Enter') load(); });
  const saved = localStorage.getItem('admin-key');
  if (saved) { $('key').value = saved; load(); }
</script>
</body>
</html>
